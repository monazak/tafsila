.inv{background:radial-gradient(ellipse 120% 60% at 50% 0,#4a263d,#2f1c28 60%)}
.hero{padding-top:150px}
.names{background:linear-gradient(100deg,#c99b52,#f6e3b4 45%,#c99b52);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn.ghost{color:#f0d9a6}
.seg input:checked+span{background:#d9b779;color:#2b1a25;border-color:#d9b779}
.form input,.form select,.seg span{background:rgba(255,255,255,.06)}
.card .ic{background:rgba(0,0,0,.2)}
.stars circle{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.glow{animation:gl 2.4s ease-in-out infinite}@keyframes gl{50%{opacity:.55}}
